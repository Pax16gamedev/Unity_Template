# Set to true to add reviewers to pull requests
addReviewers: true

# Set to true to add assignees to pull requests
addAssignees: false

skipDraft: true        # no asigna reviewers si la PR es draft

# How many reviewers to add. Default is 1 if omitted. 0 means all reviewers.
numberOfReviewers: 0

# A list of reviewers to be added to pull requests (GitHub user name)
reviewers:
  - pax16gamedev
